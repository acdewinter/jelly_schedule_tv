name: Release

# Tag a commit `vX.Y.Z` to build a signed release APK and attach it to a GitHub release.
# Signing needs four repository secrets (see README, "Releases"):
#   SIGNING_KEYSTORE_BASE64, SIGNING_KEYSTORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;35.0.0 platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION="0.0.0-${GITHUB_SHA::7}"; fi
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set; add the signing secrets to the repository."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Unit tests
        run: ./gradlew :app:testReleaseUnitTest --no-daemon --stacktrace

      - name: Assemble signed release APK
        env:
          SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "jelly-schedule-tv-${APP_VERSION_NAME}.apk"
          sha256sum "jelly-schedule-tv-${APP_VERSION_NAME}.apk" > "jelly-schedule-tv-${APP_VERSION_NAME}.apk.sha256"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jelly-schedule-tv-${{ steps.version.outputs.name }}
          path: jelly-schedule-tv-*.apk*

      - name: GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Jelly Schedule TV ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: |
            jelly-schedule-tv-${{ steps.version.outputs.name }}.apk
            jelly-schedule-tv-${{ steps.version.outputs.name }}.apk.sha256
